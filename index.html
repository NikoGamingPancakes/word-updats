<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weekly Updates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #eee;
    }

    header {
      background: #181818;
      border-bottom: 1px solid #333;
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
    }

    header p {
      color: #aaa;
      margin-top: 10px;
    }

    main {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .week {
      background: #191919;
      border: 1px solid #2c2c2c;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .week-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .week-range {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .has-update {
      background: #1f542d;
      color: #aaffbd;
    }

    .no-update {
      background: #333;
      color: #aaa;
    }

    .empty {
      color: #777;
      margin: 18px 0 0;
      font-style: italic;
    }

    .update {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }

    .update-date {
      color: #999;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
      font-size: 28px;
    }

    h3 {
      margin-top: 26px;
      font-size: 16px;
      letter-spacing: 1px;
      color: #ff8c32;
    }

    ul {
      padding-left: 24px;
    }

    li {
      margin: 8px 0;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 36px;
      }

      .week-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Weekly Updates</h1>
  <p>2026 update history</p>
</header>

<main id="weeks"></main>

<script>

const YEAR = 2026;

/*
  ADD NEW UPDATES HERE.

  Copy one of these sections whenever you make a new update.
*/

const updates = [

  {
    date: "2026-10-03",
    title: "October Update #1",

    sections: [
      {
        title: "NEW CONTENT",
        items: [
          "october!!!",
          "october month the oranges GROW GROW GROW"
        ]
      },

      {
        title: "NEW PLUMBER TRICKS",
        items: [
          "orange",
          "mei mei orange",
          "Creamy Carl 2"
        ]
      },

      {
        title: "CHANGES",
        items: [
          "removed the rot"
        ]
      },

      {
        title: "COMING SOON",
        items: [
          "October Update #2"
        ]
      }
    ]
  }

];


// -------------------------------
// YOU DON'T NEED TO EDIT BELOW THIS
// -------------------------------

const container = document.getElementById("weeks");

function makeUTCDate(year, month, day) {
  return new Date(Date.UTC(year, month, day));
}

function addDays(date, days) {
  const copy = new Date(date);
  copy.setUTCDate(copy.getUTCDate() + days);
  return copy;
}

function formatDate(date) {
  return date.toLocaleDateString("en-AU", {
    timeZone: "UTC",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

function formatShortDate(date) {
  return date.toLocaleDateString("en-AU", {
    timeZone: "UTC",
    day: "numeric",
    month: "short"
  });
}

function parseDate(dateString) {
  const [year, month, day] = dateString
    .split("-")
    .map(Number);

  return makeUTCDate(year, month - 1, day);
}


// Build every week of 2026.

const yearStart = makeUTCDate(YEAR, 0, 1);
const yearEnd = makeUTCDate(YEAR, 11, 31);

let weekStart = new Date(yearStart);
let weeks = [];

while (weekStart <= yearEnd) {

  let weekEnd;

  // First week ends on Sunday.
  if (weeks.length === 0) {
    const day = weekStart.getUTCDay();

    const daysUntilSunday =
      day === 0 ? 0 : 7 - day;

    weekEnd = addDays(
      weekStart,
      daysUntilSunday
    );
  }

  // Every week after that is Monday → Sunday.
  else {
    weekEnd = addDays(weekStart, 6);
  }

  if (weekEnd > yearEnd) {
    weekEnd = new Date(yearEnd);
  }

  weeks.push({
    start: new Date(weekStart),
    end: new Date(weekEnd)
  });

  weekStart = addDays(weekEnd, 1);
}


// Show newest weeks first.

weeks.reverse();


for (const week of weeks) {

  const weekUpdates = updates.filter(update => {

    const date = parseDate(update.date);

    return (
      date >= week.start &&
      date <= week.end
    );

  });


  const card = document.createElement("section");

  card.className = "week";


  const header = document.createElement("div");

  header.className = "week-header";


  const range = document.createElement("div");

  range.className = "week-range";

  range.textContent =
    `${formatShortDate(week.start)} – ${formatShortDate(week.end)}`;


  const status = document.createElement("div");

  status.className =
    "status " +
    (weekUpdates.length
      ? "has-update"
      : "no-update");


  status.textContent =
    weekUpdates.length
      ? "UPDATE"
      : "NO UPDATE";


  header.appendChild(range);
  header.appendChild(status);

  card.appendChild(header);


  if (weekUpdates.length === 0) {

    const message = document.createElement("p");

    message.className = "empty";

    message.textContent =
      "No update this week.";

    card.appendChild(message);

  }


  for (const update of weekUpdates) {

    const updateBox =
      document.createElement("article");

    updateBox.className = "update";


    const updateDate =
      document.createElement("div");

    updateDate.className = "update-date";

    updateDate.textContent =
      formatDate(parseDate(update.date));


    const title =
      document.createElement("h2");

    title.textContent = update.title;


    updateBox.appendChild(updateDate);
    updateBox.appendChild(title);


    for (const section of update.sections) {

      const heading =
        document.createElement("h3");

      heading.textContent =
        section.title;


      const list =
        document.createElement("ul");


      for (const item of section.items) {

        const li =
          document.createElement("li");

        li.textContent = item;

        list.appendChild(li);

      }


      updateBox.appendChild(heading);
      updateBox.appendChild(list);

    }


    card.appendChild(updateBox);

  }


  container.appendChild(card);

}

</script>

</body>
</html>
